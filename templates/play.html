<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Question</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="card">
        <p class="eyebrow">Question {{ number }} / {{ total }}</p>

        <div class="progress">
            <div style="width: {{ (number - 1) / total * 100 }}%"></div>
        </div>

        <h1 class="question">{{ question.question }}</h1>

        <form method="POST">
            {% for choice in question.choices %}
                <label class="answer">
                    <input type="radio" name="answer" value="{{ choice }}" required>
                    <span>{{ choice }}</span>
                </label>
            {% endfor %}

            <button class="primary" type="submit">Submit answer →</button>
        </form>
    </main>
</body>
</html>
