<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="card hero">
        <p class="eyebrow">Quiz complete</p>
        <div class="icon">
            {% if score == total %}🏆{% elif score >= 3 %}🎉{% else %}🌱{% endif %}
        </div>

        <h1>
            {% if score == total %}
                Perfect score!
            {% elif score >= 3 %}
                Nice work!
            {% else %}
                Keep practicing!
            {% endif %}
        </h1>

        <p class="intro">Your score</p>
        <div class="score">{{ score }} / {{ total }}</div>

        <a class="primary link-button" href="{{ url_for('home') }}">Play again →</a>
    </main>
</body>
</html>
